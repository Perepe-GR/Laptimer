name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el zip más reciente
        run: |
          ZIP=$(ls *.zip | sort -V | tail -n1)
          echo "Usando $ZIP"
          mkdir proyecto
          unzip -q "$ZIP" -d proyecto
          echo "PROJ=$(ls -d proyecto/*/ | head -n1)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - name: Copiar APK
        run: cp "${{ env.PROJ }}app/build/outputs/apk/debug/app-debug.apk" laptimer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: laptimer-apk
          path: laptimer.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK más reciente
          prerelease: true
          files: laptimer.apk
