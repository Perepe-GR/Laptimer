name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el zip más reciente y detectar versión
        run: |
          ZIP=$(ls *.zip | sort -V | tail -n1)
          echo "Usando $ZIP"
          
          # Extriurem la versió del nom del zip (ex: de laptimer-v10.zip obtenim v10)
          VERSION=$(echo "$ZIP" | sed -E 's/laptimer-(.*)\.zip/\1/')
          echo "Versió detectada: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          
          mkdir proyecto
          python3 -c "import zipfile; zipfile.ZipFile('$ZIP').extractall('proyecto')"
          echo "PROJ=proyecto/" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - name: Copiar i renombrar APK amb la versió
        run: |
          APK_NAME="laptimer-${{ env.APP_VERSION }}.apk"
          cp "${{ env.PROJ }}app/build/outputs/apk/debug/app-debug.apk" "$APK_NAME"
          echo "APK renombrat a: $APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: laptimer-apk
          path: laptimer-${{ env.APP_VERSION }}.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.APP_VERSION }}
          name: APK ${{ env.APP_VERSION }}
          prerelease: true
          files: laptimer-${{ env.APP_VERSION }}.apk
